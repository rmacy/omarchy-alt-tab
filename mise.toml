[tools]
node = "24"

[tasks.test]
description = "Run the window switcher model tests"
run = "node --test tests/*.test.mjs"

[tasks.lint]
description = "Validate plugin QML"
run = "/usr/lib/qt6/bin/qmllint -I /usr/share/omarchy/shell WindowSwitcher.qml Service.qml"

[tasks.validate]
description = "Validate the Omarchy plugin manifest"
run = "omarchy plugin validate ."

[tasks.check]
description = "Run every repository check"
depends = ["test", "lint", "validate"]
